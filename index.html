<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1730" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Seguimiento de estudio y actividad física del Tratado de la Remontada" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Remontada" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Remontada</title>
    <script>
      try { var t = localStorage.getItem("remontada.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="splash"><span>Remontada<b>.</b></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
